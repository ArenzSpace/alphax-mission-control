<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AlphaX Space Mission Control</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

#cesiumContainer {
    width: 100%;
    height: 100vh;
}

.hud {
    position: absolute;
    top: 15px;
    left: 15px;
    z-index: 10;
    padding: 12px 16px;
    background: rgba(5, 10, 18, 0.9);
    color: white;
    border: 1px solid #334155;
    border-radius: 8px;
}

.hud b {
    display: block;
    font-size: 14px;
}

.hud span {
    display: block;
    margin-top: 5px;
    font-size: 11px;
    color: #9ca3af;
}
</style>
</head>

<body>

<div id="cesiumContainer"></div>

<div class="hud">
    <b>ALPHAX SPACE MISSION CONTROL</b>
    <span>ALPHAX-01 · ORBITAL TEST</span>
</div>

<script>
const script = document.createElement("script");

script.src =
"https://cesium.com/downloads/cesiumjs/releases/1.132/Build/Cesium/Cesium.js";

script.onload = function () {

    const viewer = new Cesium.Viewer("cesiumContainer", {
        animation: false,
        timeline: false,
        baseLayerPicker: false,
        geocoder: false,
        homeButton: false,
        sceneModePicker: false,
        navigationHelpButton: false,
        fullscreenButton: false
    });

    viewer.camera.flyHome(0);
};

document.head.appendChild(script);
</script>

</body>
</html>
