<!DOCTYPE html>
<html lang="en">

<style>
html, body {

}

#cesiumContainer {
    width: 100%;
    height: 100vh;
}

.hud {
    position: absolute;
    top: 15px;
    left: 15px;
    z-index: 10;
    padding: 12px 16px;
    background: rgba(5, 10, 18, 0.9);
    color: white;
    border: 1px solid #334155;
    border-radius: 8px;
}

.hud b {
    display: block;
    font-size: 14px;
}

.hud span {
    display: block;
    margin-top: 5px;
    font-size: 11px;
    color: #9ca3af;
}
</style>
</head>

<body>

<div id="cesiumContainer"></div>

<div class="hud">
    <b>ALPHAX SPACE MISSION CONTROL</b>
    <span>ALPHAX-01 · ORBITAL TEST</span>

<script>
